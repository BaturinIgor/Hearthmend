name: Screenshots

# Скриншоты для App Store: собирает игру под симулятор, запускает демо-состояние (-demo -shot <экран>)
# на 13 языках, кладет уменьшенные копии в ветку shots-preview и по флажку upload загружает
# скриншоты страницы и скриншот магазина для проверки покупок в App Store Connect (tools/asc_shots.py).
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Загрузить в App Store Connect"
        type: boolean
        default: false
      qa:
        description: "Только кадры для проверки интерфейса (ru и en), без App Store"
        type: boolean
        default: false
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  shots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'screenshots')
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Unpack sprites
        env:
          ASSETS_KEY: ${{ secrets.ASSETS_KEY }}
        run: |
          if [ -z "$ASSETS_KEY" ]; then echo "::warning::нет ASSETS_KEY, скриншоты с эмодзи"; exit 0; fi
          if openssl enc -d -aes-256-cbc -md sha256 -in Art/sprites.enc -pass env:ASSETS_KEY | tar -xz -C Hearthmend/Resources; then
            if [ -f Hearthmend/Resources/Sprites/appicon.png ]; then
              mv Hearthmend/Resources/Sprites/appicon.png Hearthmend/Resources/Assets.xcassets/AppIcon.appiconset/icon.png
            fi
          else
            rm -rf Hearthmend/Resources/Sprites
            echo "::warning::Не удалось расшифровать спрайты, скриншоты с эмодзи"
          fi

      - name: Build for simulator
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Hearthmend.xcodeproj -scheme Hearthmend -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -50; exit 1; }

      - name: Take screenshots
        run: |
          set -e
          APP=build/Build/Products/Debug-iphonesimulator/Hearthmend.app
          # самый большой iPhone, который есть в этом Xcode (для App Store нужен 6.9")
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          names=[x for r in d.values() for x in r if 'iPhone' in x['name']]
          best=[x for x in names if 'Pro Max' in x['name']] or [x for x in names if 'Plus' in x['name']] or names
          print(best[-1]['udid'], best[-1]['name'], file=sys.stderr)
          print(best[-1]['udid'])")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          # после загрузки система показывает приветственные уведомления: ждем, пока уйдут
          sleep 90
          mkdir -p shots/store
          shoot() { # язык, файл, аргументы
            xcrun simctl terminate "$DEVICE" com.personal.hearthmend 2>/dev/null || true
            xcrun simctl launch "$DEVICE" com.personal.hearthmend -demo -AppleLanguages "($1)" ${@:3}
            sleep 8
            # системное уведомление сверху портит кадр: тогда ждем и снимаем снова
            for try in 1 2 3 4 5; do
              xcrun simctl io "$DEVICE" screenshot "$2" >/dev/null
              sips -s format bmp -c 140 700 --cropOffset 120 310 "$2" --out /tmp/top.bmp >/dev/null
              python3 -c "
          import sys
          b=open('/tmp/top.bmp','rb').read(); off=int.from_bytes(b[10:14],'little'); px=b[off:]
          v=sum(px[i] for i in range(0,len(px),7))/max(1,len(range(0,len(px),7)))
          sys.exit(1 if v>185 else 0)" && break
              echo "уведомление на $2, снимаю снова"; sleep 10
            done
          }
          # прогрев: первый запуск дольше
          shoot en /tmp/warmup.png -shot board
          sleep 20
          if [ "${{ inputs.qa }}" = "true" ]; then
            mkdir -p shots/qa
            for lang in ru en ja; do
              for s in qa_board qa_selected qa_quests qa_album qa_settings qa_daily qa_celebrate qa_toast qa_basket qa_story qa_jar qa_friends qa_achievements qa_pets; do
                shoot $lang shots/qa/${lang}_$s.png -shot $s
              done
              shoot $lang shots/qa/${lang}_qa_village.png -village -shot qa_village
              shoot $lang shots/qa/${lang}_qa_far.png -village -shot qa_far
              shoot $lang shots/qa/${lang}_qa_shop.png -shop -shot shop
            done
            exit 0
          fi
          shoot en shots/review_shop.png -shop -shot shop
          for pair in en:en-US ru:ru uk:uk de:de-DE fr:fr-FR es:es-ES pt-BR:pt-BR it:it ja:ja ko:ko zh-Hans:zh-Hans tr:tr pl:pl; do
            lang=${pair%%:*}; locale=${pair#*:}
            mkdir -p shots/store/$locale
            shoot $lang shots/store/$locale/01_board.png -shot board
            shoot $lang shots/store/$locale/02_village.png -village -shot village
            shoot $lang shots/store/$locale/03_event.png -shot event
            shoot $lang shots/store/$locale/04_north.png -village -shot north
            shoot $lang shots/store/$locale/05_postcard.png -shot postcard
          done
          sips -g pixelWidth -g pixelHeight shots/store/en-US/01_board.png shots/review_shop.png

      - name: Preview branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir preview
          for f in shots/qa/*.png; do
            [ -f "$f" ] || continue
            sips -Z 640 -s format jpeg -s formatOptions 70 "$f" --out "preview/$(basename $f .png).jpg" >/dev/null
          done
          for f in shots/store/*/*.png; do
            [ -f "$f" ] || continue
            l=$(basename $(dirname $f)); n=$(basename $f .png)
            sips -Z 640 -s format jpeg -s formatOptions 70 "$f" --out "preview/${l}_${n}.jpg" >/dev/null
          done
          [ -f shots/review_shop.png ] && sips -Z 640 -s format jpeg -s formatOptions 70 shots/review_shop.png --out preview/review_shop.jpg >/dev/null
          cd preview
          git init -q -b shots-preview
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Скриншоты ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" shots-preview

      - name: Upload to App Store Connect
        if: github.event_name == 'workflow_dispatch' && inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 -m pip install --break-system-packages -q "pyjwt[crypto]==2.9.0" || python3 -m pip install -q "pyjwt[crypto]==2.9.0"
          python3 tools/asc_shots.py shots
