name: "App Store Connect: покупки и страница"

# Заводит покупки и подписку VIP (tools/asc_iap.py) и тексты страницы приложения на всех языках
# (tools/asc_listing.py). Запуск только по кнопке.
on:
  workflow_dispatch:

jobs:
  iap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pyjwt[crypto]==2.9.0"
      - name: Create in-app purchases
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then echo "::error::Нет секретов ASC_*"; exit 1; fi
          python tools/asc_iap.py
      - name: App Store page texts
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: python tools/asc_listing.py
