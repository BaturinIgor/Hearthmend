name: Build IPA

# Проверка, что приложение собирается для устройства. Готовый .ipa никуда не выкладывается:
# в нем спрайты пака, а репозиторий может быть публичным. Игра ставится через TestFlight.
# Сборка на macOS идет на main, по кнопке и на PR с меткой build-ipa.
on:
  pull_request:
    types: [labeled, synchronize]
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'build-ipa')
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Unpack sprites
        env:
          ASSETS_KEY: ${{ secrets.ASSETS_KEY }}
        run: |
          if [ -z "$ASSETS_KEY" ] || [ ! -f Art/sprites.enc ]; then
            echo "::warning::ASSETS_KEY или Art/sprites.enc нет, сборка с временной графикой (эмодзи)"
            exit 0
          fi
          mkdir -p Hearthmend/Resources
          if openssl enc -d -aes-256-cbc -md sha256 -in Art/sprites.enc -pass env:ASSETS_KEY | tar -xz -C Hearthmend/Resources; then
            echo "::notice::Спрайтов: $(ls Hearthmend/Resources/Sprites | wc -l | tr -d ' ')"
            # иконка из пака заменяет простую иконку из репозитория
            if [ -f Hearthmend/Resources/Sprites/appicon.png ]; then
              mv Hearthmend/Resources/Sprites/appicon.png Hearthmend/Resources/Assets.xcassets/AppIcon.appiconset/icon.png
            fi
          else
            rm -rf Hearthmend/Resources/Sprites
            echo "::warning::Не удалось расшифровать Art/sprites.enc (другой ASSETS_KEY?), сборка с эмодзи"
          fi

      - name: Install tools
        run: |
          brew install xcodegen
          xcodebuild -version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          set +e
          xcodebuild \
            -project Hearthmend.xcodeproj \
            -scheme Hearthmend \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) SIDELOAD' \
            build > build.log 2>&1
          status=$?
          echo "---- errors ----"
          grep -E "error:|fatal error" build.log | sort -u | head -150
          # ошибки компиляции видны в аннотациях проверки
          grep -E "error:|fatal error" build.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          echo "---- tail ----"
          tail -40 build.log
          exit $status

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
