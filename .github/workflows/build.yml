name: Build IPA

# Сборка на macOS дорогая для приватного репозитория (минуты x10), поэтому только main, по кнопке
# и на PR с меткой build-ipa.
on:
  pull_request:
    types: [labeled, synchronize]
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'build-ipa')
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Unpack sprites
        env:
          ASSETS_KEY: ${{ secrets.ASSETS_KEY }}
        run: |
          if [ -z "$ASSETS_KEY" ] || [ ! -f Art/sprites.enc ]; then
            echo "::warning::ASSETS_KEY или Art/sprites.enc нет, сборка с временной графикой (эмодзи)"
            exit 0
          fi
          mkdir -p Hearthmend/Resources
          if openssl enc -d -aes-256-cbc -md sha256 -in Art/sprites.enc -pass env:ASSETS_KEY | tar -xz -C Hearthmend/Resources; then
            echo "::notice::Спрайтов: $(ls Hearthmend/Resources/Sprites | wc -l | tr -d ' ')"
            # иконка из пака заменяет простую иконку из репозитория
            if [ -f Hearthmend/Resources/Sprites/appicon.png ]; then
              mv Hearthmend/Resources/Sprites/appicon.png Hearthmend/Resources/Assets.xcassets/AppIcon.appiconset/icon.png
            fi
          else
            rm -rf Hearthmend/Resources/Sprites
            echo "::warning::Не удалось расшифровать Art/sprites.enc (другой ASSETS_KEY?), сборка с эмодзи"
          fi

      - name: Install tools
        run: |
          brew install xcodegen ldid
          xcodebuild -version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          set +e
          xcodebuild \
            -project Hearthmend.xcodeproj \
            -scheme Hearthmend \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) SIDELOAD' \
            build > build.log 2>&1
          status=$?
          echo "---- errors ----"
          grep -E "error:|fatal error" build.log | sort -u | head -150
          echo "---- tail ----"
          tail -40 build.log
          exit $status

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/Hearthmend.app"
          ldid -S "$APP/Hearthmend"
          rm -rf Payload Hearthmend.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Hearthmend.ipa Payload
          ls -lh Hearthmend.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Hearthmend-ipa
          path: Hearthmend.ipa

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" Hearthmend.ipa \
            --title "Hearthmend, сборка ${{ github.run_number }}" \
            --notes "Скачай Hearthmend.ipa и установи через SideStore." \
            --latest
